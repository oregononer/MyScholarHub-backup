apiVersion: apps/v1
kind: Deployment
metadata:
  name: scholarhub-backend
  namespace: scholarhub
spec:
  replicas: 2  # High availability
  selector:
    matchLabels:
      app: scholarhub-backend
  template:
    metadata:
      labels:
        app: scholarhub-backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "scholarhub-role"
        vault.hashicorp.com/auth-path: "auth/kubernetes"
        vault.hashicorp.com/agent-inject-secret-database-config: "database/creds/scholarhub-role"
        vault.hashicorp.com/agent-inject-template-database-config: |
          {{- with secret "database/creds/scholarhub-role" -}}
          export DB_USER="{{ .Data.username }}"
          export DB_PASSWORD="{{ .Data.password }}"
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-app-config: "secret/data/scholarhub/django"
        vault.hashicorp.com/agent-inject-template-app-config: |
          {{- with secret "secret/data/scholarhub/django" -}}
          export DJANGO_SECRET_KEY="{{ .Data.data.secret_key }}"
          {{- end -}}
    spec:
      serviceAccountName: scholarhub-backend-sa
      containers:
      - name: django
        image: scholarhub-backend:v12
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: "mariadb.scholarhub.svc.cluster.local"
        - name: DJANGO_ALLOWED_HOSTS
          value: "scholarhub.example.com,scholarhub-backend.scholarhub.svc.cluster.local"
        - name: DJANGO_DEBUG
          value: "False"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/stats/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/stats/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        # Gunakan gunicorn, BUKAN runserver
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Menunggu Vault Agent menyiapkan kredensial..."
            while [ ! -f /vault/secrets/database-config ]; do 
              sleep 1
            done
            
            # Load semua secrets dari Vault
            . /vault/secrets/database-config
            . /vault/secrets/app-config
            
            # Jalankan migrasi
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            
            # Gunakan Gunicorn (production WSGI server)
            echo "Kredensial ditemukan! Menjalankan Gunicorn..."
            gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 scholarhub.wsgi:application
---
apiVersion: v1
kind: Service
metadata:
  name: scholarhub-backend
  namespace: scholarhub
spec:
  type: ClusterIP  # Internal only — Nginx sebagai ingress
  selector:
    app: scholarhub-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scholarhub-backend-sa
  namespace: scholarhub