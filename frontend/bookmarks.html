<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks | ScholarHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background-color: #f8f9fc; font-family: 'Poppins', sans-serif;">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-mortarboard-fill" style="color: #7b2cbf;"></i> ScholarHub</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Scholarships</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold" style="color: #7b2cbf;" href="bookmarks.html">Bookmarks</a></li>
                    <li class="nav-item ms-lg-3 border-start border-secondary-subtle ps-lg-3"><a class="nav-link text-warning fw-bold" href="promote.html"><i class="bi bi-megaphone-fill me-1"></i> For Providers: Promote</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-promotions.html">My Promotions</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item ms-2"><button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-pill px-3"><i class="bi bi-box-arrow-right"></i> Logout</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5" style="max-width: 900px;">
        <h2 class="fw-bold mb-2"><i class="bi bi-bookmark-heart me-2"></i>My Bookmarks</h2>
        <p class="text-muted mb-4">Beasiswa yang sudah kamu simpan.</p>

        <div id="bookmarkList">
            <div class="text-center py-5"><div class="spinner-border" style="color: #7b2cbf;"></div></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script>
        if (!requireAuth()) { /* redirected */ }

        async function loadBookmarks() {
            const list = document.getElementById('bookmarkList');
            try {
                const resp = await apiFetch('/me/bookmarks/');
                const data = await resp.json();
                const results = data.results || data;

                if (results.length === 0) {
                    list.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-bookmark fs-1 text-muted"></i>
                            <p class="text-muted mt-3">Belum ada beasiswa yang disimpan.</p>
                            <a href="dashboard.html" class="btn btn-auth rounded-pill px-4 mt-2">Jelajahi Beasiswa</a>
                        </div>`;
                    return;
                }

                list.innerHTML = '';
                results.forEach(item => {
                    list.innerHTML += `
                        <div class="card border-0 shadow-sm rounded-4 p-4 mb-3 bookmark-card" id="bookmark-${item.id}">
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="d-flex align-items-center justify-content-center rounded-3" style="width: 50px; height: 50px; background: linear-gradient(135deg, #667eea, #764ba2);">
                                        <i class="bi bi-mortarboard-fill text-white"></i>
                                    </div>
                                    <div>
                                        <h6 class="fw-bold mb-1">${item.scholarship_title}</h6>
                                        <div class="d-flex gap-3 small text-muted">
                                            <span><i class="bi bi-building me-1"></i>${item.scholarship_provider || '-'}</span>
                                            <span><i class="bi bi-clock me-1"></i>${formatDate(item.scholarship_deadline)}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex gap-2">
                                    <a href="detail.html?slug=${item.scholarship_slug || ''}&id=${item.scholarship}" class="btn btn-auth btn-sm rounded-pill px-3">Detail</a>
                                    <button onclick="removeBookmark(${item.id}, this)" class="btn btn-outline-danger btn-sm rounded-pill px-3" title="Hapus">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>`;
                });
            } catch(e) {
                list.innerHTML = '<p class="text-danger text-center">Gagal memuat bookmarks.</p>';
            }
        }

        async function removeBookmark(bookmarkId, btn) {
            if (!confirm('Hapus bookmark ini?')) return;
            try {
                const resp = await apiFetch(`/me/bookmarks/${bookmarkId}/`, { method: 'DELETE' });
                if (resp.ok || resp.status === 204) {
                    document.getElementById(`bookmark-${bookmarkId}`).remove();
                    showToast('Bookmark dihapus', 'success');
                }
            } catch(e) {
                showToast('Gagal menghapus', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadBookmarks);
    </script>
</body>
</html>
