<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks | myscholarhub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="theme-dark">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-mortarboard-fill text-warning me-2"></i>myscholarhub
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Scholarships</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold" style="color: #7b2cbf;" href="bookmarks.html">Bookmarks</a></li>
                    <li class="nav-item ms-lg-3 border-start border-secondary-subtle ps-lg-3"><a class="nav-link text-warning fw-bold" href="promote.html"><i class="bi bi-megaphone-fill me-1"></i> For Providers: Promote</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-promotions.html">My Promotions</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item ms-2">
                        <button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container" style="max-width: 900px; padding-top: 100px; padding-bottom: 50px;">
        <div class="mb-5 text-center" data-aos="fade-up">
            <h2 class="fw-bold mb-2"><i class="bi bi-bookmark-heart text-warning me-2"></i>My Bookmarks</h2>
            <p class="text-white opacity-75">Beasiswa yang sudah kamu simpan untuk direview kembali.</p>
        </div>

        <div id="bookmarkList">
            <div class="text-center py-5"><div class="spinner-border" style="color: #7b2cbf;"></div></div>
        </div>
    </main>

    <!-- Footer Simple -->
    <footer class="footer-dark mt-5 border-top border-secondary py-4 text-center">
        <div class="container text-white opacity-50 small">
            &copy; 2026 myscholarhub. All rights reserved.
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });
        if (!requireAuth()) { /* redirected */ }

        async function loadBookmarks() {
            const list = document.getElementById('bookmarkList');
            try {
                const resp = await apiFetch('/me/bookmarks/');
                const data = await resp.json();
                const results = data.results || data;

                if (results.length === 0) {
                    list.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-bookmark fs-1 text-muted"></i>
                            <p class="text-muted mt-3">Belum ada beasiswa yang disimpan.</p>
                            <a href="dashboard.html" class="btn btn-auth rounded-pill px-4 mt-2">Jelajahi Beasiswa</a>
                        </div>`;
                    return;
                }

                list.innerHTML = '';
                results.forEach((item, index) => {
                    list.innerHTML += `
                        <div class="custom-card glass-box p-4 mb-3 bookmark-card" id="bookmark-${item.id}" data-aos="fade-up" data-aos-delay="${50 * index}">
                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="icon-box" style="background: linear-gradient(135deg, #667eea, #764ba2);">
                                        <i class="bi bi-mortarboard-fill text-white"></i>
                                    </div>
                                    <div>
                                        <h6 class="fw-bold mb-1">${escapeHTML(item.scholarship_title)}</h6>
                                        <div class="d-flex flex-wrap gap-3 small text-white opacity-75">
                                            <span><i class="bi bi-building me-1 text-warning"></i>${escapeHTML(item.scholarship_provider) || '-'}</span>
                                            <span class="text-danger fw-semibold"><i class="bi bi-clock me-1"></i>${escapeHTML(formatDate(item.scholarship_deadline))}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex gap-2">
                                    <a href="detail.html?slug=${escapeHTML(item.scholarship_slug) || ''}&id=${item.scholarship}" class="btn btn-outline-light btn-sm rounded-pill px-4">Lihat Detail</a>
                                    <button onclick="removeBookmark(${item.id}, this)" class="btn btn-outline-danger btn-sm rounded-pill px-3" title="Hapus">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>`;
                });
            } catch(e) {
                list.innerHTML = '<p class="text-danger text-center">Gagal memuat bookmarks.</p>';
            }
        }

        async function removeBookmark(bookmarkId, btn) {
            if (!confirm('Hapus bookmark ini?')) return;
            try {
                const resp = await apiFetch(`/me/bookmarks/${bookmarkId}/`, { method: 'DELETE' });
                if (resp.ok || resp.status === 204) {
                    document.getElementById(`bookmark-${bookmarkId}`).remove();
                    showToast('Bookmark dihapus', 'success');
                }
            } catch(e) {
                showToast('Gagal menghapus', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadBookmarks);
    </script>
</body>
</html>
