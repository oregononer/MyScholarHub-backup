<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | myscholarhub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="theme-dark">

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-mortarboard-fill text-warning me-2"></i>myscholarhub
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Scholarships</a></li>
                    <li class="nav-item"><a class="nav-link" href="bookmarks.html">Bookmarks</a></li>
                    <li class="nav-item ms-lg-3 border-start border-secondary-subtle ps-lg-3"><a class="nav-link text-warning fw-bold" href="promote.html"><i class="bi bi-megaphone-fill me-1"></i> For Providers: Promote</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-promotions.html">My Promotions</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-warning" href="profile.html">Profile</a></li>
                    <li class="nav-item ms-2">
                        <button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container" style="max-width: 800px; padding-top: 100px; padding-bottom: 50px;">
        <div class="mb-5 text-center" data-aos="fade-up">
            <h2 class="fw-bold mb-2"><i class="bi bi-person-circle text-warning me-2"></i>My Profile</h2>
            <p class="text-white opacity-75">Kelola informasi akun dan profil akademik kamu.</p>
        </div>

        <!-- Personal Info -->
        <div class="glass-box p-4 mb-5" data-aos="fade-up" data-aos-delay="100">
            <h5 class="fw-bold mb-4 text-white"><i class="bi bi-info-circle me-2 text-warning"></i>Personal Info</h5>
            <form id="profileForm">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-white opacity-75">Username</label>
                        <input type="text" id="profileUsername" class="form-control form-control-custom" placeholder="Loading...">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-white opacity-75">Email</label>
                        <input type="email" id="profileEmail" class="form-control form-control-custom" disabled>
                        <div class="form-text small opacity-50">Email dikelola oleh sistem.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-white opacity-75">Nama Lengkap</label>
                        <input type="text" id="profileFullName" class="form-control form-control-custom" placeholder="Nama lengkap">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-white opacity-75">Jenjang Pendidikan</label>
                        <select id="profileEducation" class="form-select form-control-custom">
                            <option value="">Pilih jenjang</option>
                            <option value="SMA/SMK">SMA/SMK</option>
                            <option value="D3">D3</option>
                            <option value="D4/S1">D4/S1</option>
                            <option value="S2">S2</option>
                            <option value="S3">S3</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-white opacity-75">Institusi Saat Ini</label>
                        <input type="text" id="profileInstitution" class="form-control form-control-custom" placeholder="Nama universitas/sekolah">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold text-white opacity-75">Jurusan</label>
                        <input type="text" id="profileMajor" class="form-control form-control-custom" placeholder="Jurusan/program studi">
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-orange rounded-pill px-4 py-2">
                        <i class="bi bi-check-lg me-1"></i> Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>

        <!-- Change Password -->
        <div class="glass-box p-4" data-aos="fade-up" data-aos-delay="200">
            <h5 class="fw-bold mb-4 text-white"><i class="bi bi-shield-lock me-2 text-danger"></i>Keamanan (Change Password)</h5>
            <form id="passwordForm">
                <div class="row g-4">
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold text-white opacity-75">Password Lama</label>
                        <input type="password" id="oldPassword" class="form-control form-control-custom" placeholder="••••••••" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold text-white opacity-75">Password Baru</label>
                        <input type="password" id="newPassword" class="form-control form-control-custom" placeholder="Min 8 karakter" required minlength="8">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold text-white opacity-75">Konfirmasi</label>
                        <input type="password" id="confirmPassword" class="form-control form-control-custom" placeholder="Ulangi password" required>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-outline-danger rounded-pill px-4 py-2">
                        <i class="bi bi-key me-1"></i> Ganti Password
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer Simple -->
    <footer class="footer-dark mt-5 border-top border-secondary py-4 text-center">
        <div class="container text-white opacity-50 small">
            &copy; 2026 myscholarhub. All rights reserved.
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });
        if (!requireAuth()) { /* redirected */ }

        async function loadProfile() {
            try {
                const resp = await apiFetch('/me/profile/');
                if (!resp.ok) throw new Error('Unauthorized');
                const data = await resp.json();

                document.getElementById('profileUsername').value = data.username || '';
                document.getElementById('profileEmail').value = data.email || '';
                document.getElementById('profileFullName').value = data.full_name || '';
                document.getElementById('profileEducation').value = data.education_level || '';
                document.getElementById('profileInstitution').value = data.current_institution || '';
                document.getElementById('profileMajor').value = data.major || '';
            } catch(e) {
                showToast('Gagal memuat profil', 'error');
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            try {
                const resp = await apiFetch('/me/profile/update/', {
                    method: 'PATCH',
                    body: JSON.stringify({
                        username: document.getElementById('profileUsername').value,
                        full_name: document.getElementById('profileFullName').value,
                        education_level: document.getElementById('profileEducation').value,
                        current_institution: document.getElementById('profileInstitution').value,
                        major: document.getElementById('profileMajor').value,
                    })
                });
                if (resp.ok) {
                    showToast('Profil berhasil diperbarui!', 'success');
                } else {
                    const err = await resp.json();
                    showToast(err.error || 'Gagal update profil', 'error');
                }
            } catch(e) {
                showToast('Error koneksi!', 'error');
            }
        });

        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const oldPass = document.getElementById('oldPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (newPass !== confirmPass) {
                showToast('Password baru dan konfirmasi tidak cocok!', 'error');
                return;
            }

            try {
                const resp = await apiFetch('/me/change-password/', {
                    method: 'POST',
                    body: JSON.stringify({ old_password: oldPass, new_password: newPass })
                });
                if (resp.ok) {
                    showToast('Password berhasil diganti! Silakan login ulang.', 'success');
                    setTimeout(logout, 2000);
                } else {
                    const err = await resp.json();
                    const msg = err.old_password ? err.old_password.join(' ') : (err.new_password ? err.new_password.join(' ') : 'Gagal ganti password');
                    showToast(msg, 'error');
                }
            } catch(e) {
                showToast('Error koneksi!', 'error');
            }
        });

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
