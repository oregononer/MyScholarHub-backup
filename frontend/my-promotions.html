<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Promotions | myscholarhub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="theme-dark">

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-mortarboard-fill text-warning me-2"></i>myscholarhub
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Scholarships</a></li>
                    <li class="nav-item"><a class="nav-link" href="promote.html">Promote</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold" style="color: #7b2cbf;" href="my-promotions.html">My Promotions</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item ms-2">
                        <button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container" style="max-width: 900px; padding-top: 100px; padding-bottom: 50px;">
        <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-5" data-aos="fade-up">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-megaphone text-warning me-2"></i>My Promotions</h2>
                <p class="text-white opacity-75 mb-0">Riwayat semua promosi beasiswa Anda.</p>
            </div>
            <a href="promote.html" class="btn btn-orange rounded-pill px-4 py-2">
                <i class="bi bi-plus-lg me-1"></i> Promote Baru
            </a>
        </div>

        <div id="submissionList">
            <div class="text-center py-5"><div class="spinner-border" style="color: #7b2cbf;"></div></div>
        </div>
    </main>

    <!-- Footer Simple -->
    <footer class="footer-dark mt-5 border-top border-secondary py-4 text-center">
        <div class="container text-white opacity-50 small">
            &copy; 2026 myscholarhub. All rights reserved.
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });
        if (!requireAuth()) { /* redirected */ }

        async function loadSubmissions() {
            const list = document.getElementById('submissionList');
            try {
                const resp = await apiFetch('/me/promotions/');
                const data = await resp.json();

                if (data.length === 0) {
                    list.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-inbox fs-1 text-muted"></i>
                            <p class="text-muted mt-3">Belum ada promosi. Mulai promosikan beasiswa pertama Anda!</p>
                            <a href="promote.html" class="btn btn-auth rounded-pill px-4 mt-2"><i class="bi bi-megaphone me-1"></i> Promote Beasiswa</a>
                        </div>`;
                    return;
                }

                list.innerHTML = '';
                data.forEach((s, index) => {
                    const statusConfig = {
                        'PENDING': { bg: 'rgba(217, 119, 6, 0.2)', border: '#d97706', color: '#fcd34d', icon: 'hourglass-split', label: 'Pending Review' },
                        'PUBLISHED': { bg: 'rgba(5, 150, 105, 0.2)', border: '#059669', color: '#6ee7b7', icon: 'check-circle-fill', label: 'Approved' },
                        'REJECTED': { bg: 'rgba(220, 38, 38, 0.2)', border: '#dc2626', color: '#fca5a5', icon: 'x-circle-fill', label: 'Rejected' },
                        'DRAFT': { bg: 'rgba(100, 116, 139, 0.2)', border: '#64748b', color: '#cbd5e1', icon: 'pause-circle-fill', label: 'Draft' },
                    };
                    const st = statusConfig[s.status] || statusConfig['DRAFT'];

                    list.innerHTML += `
                        <div class="custom-card glass-box p-4 mb-3" data-aos="fade-up" data-aos-delay="${50 * index}">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="flex-grow-1">
                                    <div class="d-flex flex-wrap align-items-center gap-3 mb-2">
                                        <h5 class="fw-bold mb-0 text-white">${escapeHTML(s.title)}</h5>
                                        <span class="d-inline-flex align-items-center gap-1 px-3 py-1 rounded-pill small fw-semibold border" style="background: ${st.bg}; border-color: ${st.border} !important; color: ${st.color};">
                                            <i class="bi bi-${st.icon}"></i> ${st.label}
                                        </span>
                                    </div>
                                    <div class="d-flex flex-wrap gap-3 small text-white opacity-75 mb-3">
                                        <span><i class="bi bi-building me-1 text-warning"></i>${escapeHTML(s.provider_name)}</span>
                                        <span><i class="bi bi-calendar me-1"></i>Diajukan: ${escapeHTML(formatDate(s.created_at))}</span>
                                        <span class="text-danger fw-semibold"><i class="bi bi-clock me-1"></i>Deadline: ${escapeHTML(formatDate(s.deadline))}</span>
                                        ${s.category_name ? `<span><i class="bi bi-tag me-1"></i>${escapeHTML(s.category_name)}</span>` : ''}
                                    </div>
                                    <div class="d-flex align-items-center flex-wrap gap-2 mt-2">
                                        <span class="small text-white opacity-50">Tracking ID:</span>
                                        <code class="small px-2 py-1 rounded user-select-all" style="background: rgba(255,255,255,0.1); color: #a855f7;">${s.id}</code>
                                        <button onclick="copyTrackingId('${s.id}')" class="btn btn-outline-secondary border-0 text-white opacity-75 btn-sm rounded-pill px-2 py-0" title="Copy tracking ID">
                                            <i class="bi bi-clipboard"></i>
                                        </button>
                                    </div>
                                    ${s.status === 'REJECTED' && s.rejection_reason ? `
                                        <div class="alert mt-3 mb-0 py-2 border-danger" style="background: rgba(220, 38, 38, 0.1); color: #fca5a5;">
                                            <i class="bi bi-exclamation-triangle me-1"></i>
                                            <strong class="text-white">Alasan Penolakan:</strong> ${escapeHTML(s.rejection_reason)}
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>`;
                });
            } catch(e) {
                list.innerHTML = '<p class="text-danger text-center">Gagal memuat data promosi.</p>';
            }
        }

        function copyTrackingId(id) {
            navigator.clipboard.writeText(id).then(() => {
                showToast('Tracking ID berhasil dicopy!', 'success');
            }).catch(() => {
                showToast('Gagal copy', 'error');
            });
        }

        document.addEventListener('DOMContentLoaded', loadSubmissions);
    </script>
</body>
</html>
