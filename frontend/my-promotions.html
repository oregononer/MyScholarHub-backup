<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Promotions | ScholarHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background-color: #f8f9fc; font-family: 'Poppins', sans-serif;">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-mortarboard-fill" style="color: #7b2cbf;"></i> ScholarHub</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Scholarships</a></li>
                    <li class="nav-item"><a class="nav-link" href="promote.html">Promote</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold" style="color: #7b2cbf;" href="my-promotions.html">My Promotions</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item ms-2"><button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-pill px-3"><i class="bi bi-box-arrow-right"></i> Logout</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5" style="max-width: 900px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1"><i class="bi bi-megaphone me-2"></i>My Promotions</h2>
                <p class="text-muted mb-0">Riwayat semua promosi beasiswa Anda.</p>
            </div>
            <a href="promote.html" class="btn btn-auth rounded-pill px-4">
                <i class="bi bi-plus-lg me-1"></i> Promote Baru
            </a>
        </div>

        <div id="submissionList">
            <div class="text-center py-5"><div class="spinner-border" style="color: #7b2cbf;"></div></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script>
        if (!requireAuth()) { /* redirected */ }

        async function loadSubmissions() {
            const list = document.getElementById('submissionList');
            try {
                const resp = await apiFetch('/me/promotions/');
                const data = await resp.json();

                if (data.length === 0) {
                    list.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-inbox fs-1 text-muted"></i>
                            <p class="text-muted mt-3">Belum ada promosi. Mulai promosikan beasiswa pertama Anda!</p>
                            <a href="promote.html" class="btn btn-auth rounded-pill px-4 mt-2"><i class="bi bi-megaphone me-1"></i> Promote Beasiswa</a>
                        </div>`;
                    return;
                }

                list.innerHTML = '';
                data.forEach(s => {
                    const statusConfig = {
                        'PENDING': { bg: '#fef3c7', color: '#d97706', icon: 'hourglass-split', label: 'Pending Review' },
                        'PUBLISHED': { bg: '#d1fae5', color: '#059669', icon: 'check-circle-fill', label: 'Approved' },
                        'REJECTED': { bg: '#fee2e2', color: '#dc2626', icon: 'x-circle-fill', label: 'Rejected' },
                        'DRAFT': { bg: '#f1f5f9', color: '#64748b', icon: 'pause-circle-fill', label: 'Draft' },
                    };
                    const st = statusConfig[s.status] || statusConfig['DRAFT'];

                    list.innerHTML += `
                        <div class="card border-0 shadow-sm rounded-4 p-4 mb-3">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="flex-grow-1">
                                    <div class="d-flex align-items-center gap-3 mb-2">
                                        <h5 class="fw-bold mb-0">${s.title}</h5>
                                        <span class="d-inline-flex align-items-center gap-1 px-3 py-1 rounded-pill small fw-semibold" style="background: ${st.bg}; color: ${st.color};">
                                            <i class="bi bi-${st.icon}"></i> ${st.label}
                                        </span>
                                    </div>
                                    <div class="d-flex gap-3 small text-muted mb-2">
                                        <span><i class="bi bi-building me-1"></i>${s.provider_name}</span>
                                        <span><i class="bi bi-calendar me-1"></i>Diajukan: ${formatDate(s.created_at)}</span>
                                        <span><i class="bi bi-clock me-1"></i>Deadline: ${formatDate(s.deadline)}</span>
                                        ${s.category_name ? `<span><i class="bi bi-tag me-1"></i>${s.category_name}</span>` : ''}
                                    </div>
                                    <div class="d-flex align-items-center gap-2 mt-2">
                                        <span class="small text-muted">Tracking ID:</span>
                                        <code class="small bg-light px-2 py-1 rounded user-select-all">${s.id}</code>
                                        <button onclick="copyTrackingId('${s.id}')" class="btn btn-outline-secondary btn-sm rounded-pill px-2 py-0" title="Copy">
                                            <i class="bi bi-clipboard"></i>
                                        </button>
                                    </div>
                                    ${s.status === 'REJECTED' && s.rejection_reason ? `
                                        <div class="alert alert-danger small mt-3 mb-0 py-2">
                                            <i class="bi bi-exclamation-triangle me-1"></i>
                                            <strong>Alasan Penolakan:</strong> ${s.rejection_reason}
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>`;
                });
            } catch(e) {
                list.innerHTML = '<p class="text-danger text-center">Gagal memuat data promosi.</p>';
            }
        }

        function copyTrackingId(id) {
            navigator.clipboard.writeText(id).then(() => {
                showToast('Tracking ID berhasil dicopy!', 'success');
            }).catch(() => {
                showToast('Gagal copy', 'error');
            });
        }

        document.addEventListener('DOMContentLoaded', loadSubmissions);
    </script>
</body>
</html>
