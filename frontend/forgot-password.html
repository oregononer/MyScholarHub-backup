<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | ScholarHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-bg">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-10 col-lg-12">
                <div class="card auth-card">
                    <div class="row g-0">
                        <div class="col-md-6 auth-left d-none d-md-flex">
                            <a href="index.html" class="text-white text-decoration-none mb-5 h4 fw-bold">
                                <i class="bi bi-mortarboard-fill"></i> ScholarHub
                            </a>
                            <h2 class="fw-bold mb-4">Reset Password</h2>
                            <p class="lead mb-0 opacity-75">Masukkan email kamu untuk menerima link reset password. Link berlaku selama 1 jam.</p>
                        </div>
                        <div class="col-md-6 auth-right">
                            <!-- Step 1: Request Token -->
                            <div id="step-request">
                                <div class="text-center mb-5">
                                    <div class="icon-box bg-warning mx-auto mb-3" style="width: 60px; height: 60px;">
                                        <i class="bi bi-envelope-fill fs-4"></i>
                                    </div>
                                    <h3 class="fw-bold text-dark">Forgot Password?</h3>
                                    <p class="text-muted small">Masukkan email yang terdaftar</p>
                                </div>
                                <form id="forgotForm">
                                    <div class="mb-4">
                                        <label class="form-label text-muted small fw-semibold">Email Address</label>
                                        <input type="email" class="form-control form-control-custom" id="forgotEmail" placeholder="name@example.com" required>
                                    </div>
                                    <div id="forgotMsg" class="alert small d-none"></div>
                                    <button type="submit" class="btn btn-auth w-100 mb-3">Send Reset Link</button>
                                </form>
                                <div class="text-center">
                                    <a href="login.html" class="small text-decoration-none" style="color: #7b2cbf;">
                                        <i class="bi bi-arrow-left"></i> Kembali ke Login
                                    </a>
                                </div>
                            </div>

                            <!-- Step 2: Enter Token & New Password -->
                            <div id="step-reset" class="d-none">
                                <div class="text-center mb-5">
                                    <div class="icon-box bg-success mx-auto mb-3" style="width: 60px; height: 60px;">
                                        <i class="bi bi-key-fill fs-4"></i>
                                    </div>
                                    <h3 class="fw-bold text-dark">Reset Password</h3>
                                    <p class="text-muted small">Masukkan token dan password baru</p>
                                </div>
                                <form id="resetForm">
                                    <div class="mb-3">
                                        <label class="form-label text-muted small fw-semibold">Reset Token</label>
                                        <input type="text" class="form-control form-control-custom" id="resetToken" placeholder="Paste token dari email" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label text-muted small fw-semibold">New Password</label>
                                        <input type="password" class="form-control form-control-custom" id="newPassword" placeholder="Minimal 8 karakter" required minlength="8">
                                    </div>
                                    <div id="resetMsg" class="alert small d-none"></div>
                                    <button type="submit" class="btn btn-auth w-100 mb-3">Reset Password</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;
            const msgDiv = document.getElementById('forgotMsg');

            try {
                const response = await fetch(`${API_BASE}/auth/forgot-password/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();

                msgDiv.classList.remove('d-none', 'alert-danger');
                msgDiv.classList.add('alert-success');
                msgDiv.textContent = data.message;

                // Untuk development: isi token otomatis jika ada di response
                if (data.dev_token) {
                    document.getElementById('resetToken').value = data.dev_token;
                }

                // Tampilkan step 2
                document.getElementById('step-request').classList.add('d-none');
                document.getElementById('step-reset').classList.remove('d-none');
            } catch (error) {
                msgDiv.classList.remove('d-none', 'alert-success');
                msgDiv.classList.add('alert-danger');
                msgDiv.textContent = 'Error koneksi ke server!';
            }
        });

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const token = document.getElementById('resetToken').value;
            const newPassword = document.getElementById('newPassword').value;
            const msgDiv = document.getElementById('resetMsg');

            try {
                const response = await fetch(`${API_BASE}/auth/reset-password/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPassword })
                });
                const data = await response.json();

                if (response.ok) {
                    msgDiv.classList.remove('d-none', 'alert-danger');
                    msgDiv.classList.add('alert-success');
                    msgDiv.textContent = data.message;
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    msgDiv.classList.remove('d-none', 'alert-success');
                    msgDiv.classList.add('alert-danger');
                    msgDiv.textContent = data.error || Object.values(data).flat().join(' ');
                }
            } catch (error) {
                msgDiv.classList.remove('d-none', 'alert-success');
                msgDiv.classList.add('alert-danger');
                msgDiv.textContent = 'Error koneksi ke server!';
            }
        });
    </script>
</body>
</html>
