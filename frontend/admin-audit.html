<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Trail | myscholarhub Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light" style="font-family: 'Poppins', sans-serif;">

    <div class="admin-layout-wrapper">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="admin-sidebar-header">
                <img src="https://ui-avatars.com/api/?name=Admin&background=random" class="admin-profile-img" alt="Profile">
                <div class="admin-profile-name">System Admin</div>
                <div class="admin-profile-role">Administrator</div>
            </div>
            
            <nav class="flex-grow-1 mt-3">
                <div class="admin-nav-item">
                    <a href="admin-dashboard.html" class="admin-nav-link">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </div>
                <div class="admin-nav-item mt-1">
                    <a href="admin-moderation.html" class="admin-nav-link">
                        <i class="bi bi-clipboard-check"></i> <span data-i18n="nav.moderation">Moderasi</span>
                    </a>
                </div>
                <div class="admin-nav-item mt-1">
                    <a href="admin-users.html" class="admin-nav-link">
                        <i class="bi bi-people"></i> <span data-i18n="nav.users">Pengguna</span>
                    </a>
                </div>
                <div class="admin-nav-item mt-1">
                    <a href="admin-audit.html" class="admin-nav-link active">
                        <i class="bi bi-journal-text"></i> <span data-i18n="nav.auditlog">Log Audit</span>
                    </a>
                </div>
            </nav>

            <div class="p-3 border-top" style="border-color: #f1f5f9 !important;">
                <a href="index.html" class="admin-nav-link mb-2" style="background: none; border: 1px solid #e2e8f0; justify-content: center;">
                    <i class="bi bi-house text-primary"></i> <span style="color: #64748b" data-i18n="nav.backportal">Kembali ke Portal</span>
                </a>
                <button onclick="logout()" class="admin-nav-link w-100 border-0" style="background: #fee2e2; color: #ef4444; justify-content: center;">
                    <i class="bi bi-box-arrow-left text-danger"></i> <span data-i18n="nav.logout">Keluar</span>
                </button>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="admin-main-wrapper">
            <!-- Topbar Header -->
            <header class="admin-topbar">
                <div class="admin-brand d-lg-none">
                    <i class="bi bi-shield-lock-fill" style="color: #3b82f6;"></i>
                </div>
                <div class="admin-brand d-none d-lg-flex">
                    <i class="bi bi-shield-lock-fill" style="color: #3b82f6;"></i> Smart Admin
                </div>
                <div class="admin-search-box d-none d-lg-block">
                    <i class="bi bi-search"></i>
                    <input type="text" data-i18n-ph="topbar.search" placeholder="Cari...">
                </div>

                <div class="admin-top-actions">
                    <button class="sh-lang-btn d-none d-sm-flex" onclick="toggleLang()" id="langSwitchBtn" aria-label="Switch language">
                        <span class="sh-lang-flag" id="langFlag">🇮🇩</span>
                        <span id="langLabel">Indonesia</span>
                    </button>
                    <div class="sh-topbar-item">
                        <button class="top-icon-btn" id="notifBellBtn" aria-label="Notifications" aria-haspopup="true">
                            <i class="bi bi-bell"></i>
                            <span class="top-badge bg-warning" id="notifBadge" style="display:none;">0</span>
                        </button>
                        <div class="sh-panel" id="notifPanel" role="dialog" aria-label="Notification panel">
                            <div class="sh-panel-header"><i class="bi bi-bell-fill text-warning"></i> <span data-i18n="notif.title">Notifikasi</span></div>
                            <div class="sh-panel-body" id="notifList"></div>
                        </div>
                    </div>
                    <div class="sh-topbar-item">
                        <button class="top-icon-btn" id="emailLogBtn" aria-label="Email activity log" aria-haspopup="true">
                            <i class="bi bi-envelope"></i>
                            <span class="top-badge bg-primary" id="emailBadge" style="display:none;">0</span>
                        </button>
                        <div class="sh-panel" id="emailLogPanel" role="dialog" aria-label="Email log panel">
                            <div class="sh-panel-header"><i class="bi bi-envelope-fill text-primary"></i> <span data-i18n="email.title">Log Aktivitas Email</span></div>
                            <div class="sh-panel-body" id="emailLogList"></div>
                        </div>
                    </div>
                    <img src="https://ui-avatars.com/api/?name=Admin&background=random" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover; cursor: pointer; margin-left: 10px;" alt="Profile">
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="admin-content">
                <div class="admin-page-header">
                    <div>
                        <h1 class="admin-page-title">Audit Trail</h1>
                        <div class="admin-breadcrumb mt-1">
                            <i class="bi bi-house-door-fill text-muted"></i> <a href="admin-dashboard.html">Home</a> &gt; <span>Audit Log</span>
                        </div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="d-flex gap-3 mb-4 flex-wrap">
                    <select id="categoryFilter" class="form-select form-select-sm rounded-pill border-1 shadow-sm" style="width: auto; background: #ffffff; color: #334155;" onchange="loadLogs()">
                        <option value="">All Categories</option>
                        <option value="AUTHENTICATION">Authentication</option>
                        <option value="AUTHORIZATION">Authorization</option>
                        <option value="DATA_MUTATION">Data Mutation</option>
                        <option value="SECURITY_ANOMALY">Security Anomaly</option>
                        <option value="SYSTEM">System</option>
                    </select>
                    <select id="statusFilterAudit" class="form-select form-select-sm rounded-pill border-1 shadow-sm" style="width: auto; background: #ffffff; color: #334155;" onchange="loadLogs()">
                        <option value="">All Status</option>
                        <option value="SUCCESS">Success</option>
                        <option value="FAILED">Failed</option>
                        <option value="BLOCKED">Blocked</option>
                    </select>
                    <select id="limitFilter" class="form-select form-select-sm rounded-pill border-1 shadow-sm" style="width: auto; background: #ffffff; color: #334155;" onchange="loadLogs()">
                        <option value="25">25 entries</option>
                        <option value="50" selected>50 entries</option>
                        <option value="100">100 entries</option>
                    </select>
                </div>

                <div class="admin-white-card overflow-hidden p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 small align-middle">
                            <thead class="table-light">
                                <tr class="text-secondary text-uppercase fw-semibold">
                                    <th class="ps-4 py-3">Timestamp</th>
                                    <th class="py-3">Category</th>
                                    <th class="py-3">Action</th>
                                    <th class="py-3">User</th>
                                    <th class="py-3">Status</th>
                                    <th class="py-3">IP Address</th>
                                    <th class="py-3">Target</th>
                                </tr>
                            </thead>
                            <tbody id="logTableBody">
                                <tr><td colspan="7" class="text-center py-4 text-muted">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script>
        if (!requireAdmin()) { /* redirected */ }

        async function loadLogs() {
            const tbody = document.getElementById('logTableBody');
            const category = document.getElementById('categoryFilter').value;
            const actionStatus = document.getElementById('statusFilterAudit').value;
            const limit = document.getElementById('limitFilter').value;

            let params = `?limit=${limit}`;
            if (category) params += `&action_category=${category}`;
            if (actionStatus) params += `&action_status=${actionStatus}`;

            try {
                const resp = await apiFetch(`/admin/audit-logs/${params}`);
                const data = await resp.json();

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No logs found.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.forEach(log => {
                    const statusColors = { SUCCESS: 'text-success', FAILED: 'text-warning', BLOCKED: 'text-danger' };
                    const catColors = {
                        AUTHENTICATION: '#60a5fa',
                        AUTHORIZATION: '#f97316',
                        DATA_MUTATION: '#34d399',
                        SECURITY_ANOMALY: '#f87171',
                        SYSTEM: '#94a3b8',
                    };

                    tbody.innerHTML += `
                        <tr>
                            <td class="ps-4 font-monospace">${new Date(log.created_at).toLocaleString('id-ID')}</td>
                            <td><span class="badge rounded-pill" style="background: ${catColors[log.action_category] || '#64748b'};">${log.action_category}</span></td>
                            <td class="fw-semibold">${log.action_type}</td>
                            <td>${log.user || '<span class="text-muted">Guest</span>'}</td>
                            <td><span class="${statusColors[log.action_status] || ''} fw-bold">${log.action_status}</span></td>
                            <td class="font-monospace">${log.ip_address || '-'}</td>
                            <td class="text-muted">${log.target_table ? `${log.target_table}` : '-'}</td>
                        </tr>`;
                });
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-danger">Failed to load.</td></tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initLang();
            initNotifications();
            initEmailLog();
            loadLogs();
        });
    </script>
</body>
</html>
