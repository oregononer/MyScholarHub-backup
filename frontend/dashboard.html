<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Scholarships | ScholarHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background-color: #f8f9fc; font-family: 'Poppins', sans-serif;">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-mortarboard-fill" style="color: #7b2cbf;"></i> ScholarHub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDash"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarDash">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link fw-bold" style="color: #7b2cbf;" href="dashboard.html">Scholarships</a></li>
                    <li class="nav-item"><a class="nav-link" href="bookmarks.html">Bookmarks</a></li>
                    <li class="nav-item ms-lg-3 border-start border-secondary-subtle ps-lg-3"><a class="nav-link text-warning fw-bold" href="promote.html"><i class="bi bi-megaphone-fill me-1"></i> For Providers: Promote</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-promotions.html">My Promotions</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item ms-2">
                        <button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <!-- Header -->
        <div class="mb-4">
            <h2 class="fw-bold">Browse Scholarships</h2>
            <p class="text-muted">Temukan beasiswa yang sesuai dengan profil kamu.</p>
        </div>

        <!-- Filters -->
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold text-muted">Search</label>
                    <input type="text" id="searchInput" class="form-control form-control-custom" placeholder="Cari nama beasiswa...">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold text-muted">Kategori</label>
                    <select id="filterCategory" class="form-select form-control-custom">
                        <option value="">Semua Kategori</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold text-muted">Tipe Pendanaan</label>
                    <select id="filterCoverage" class="form-select form-control-custom">
                        <option value="">Semua Tipe</option>
                        <option value="FULL_FUNDED">Full Funded</option>
                        <option value="PARTIAL_FUNDED">Partial Funded</option>
                        <option value="ALLOWANCE_ONLY">Allowance Only</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button onclick="fetchScholarships()" class="btn btn-auth w-100">
                        <i class="bi bi-search"></i> Filter
                    </button>
                </div>
            </div>
        </div>

        <!-- Count -->
        <p id="scholarshipCount" class="text-muted small mb-3"><i class="bi bi-hourglass-split"></i> Loading scholarships...</p>

        <!-- Scholarship Grid -->
        <div id="scholarshipList" class="row g-4">
            <div class="col-12 text-center py-5 text-muted">
                <div class="spinner-border" style="color: #7b2cbf;"></div>
                <p class="mt-3">Memuat data beasiswa...</p>
            </div>
        </div>

        <!-- Pagination -->
        <nav id="paginationNav" class="d-none mt-4">
            <ul class="pagination justify-content-center" id="paginationList"></ul>
        </nav>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script>
        if (!requireAuth()) { /* redirected */ }

        let currentPage = 1;

        // Load categories for filter dropdown
        async function loadCategories() {
            try {
                const resp = await apiFetch('/categories/');
                const categories = await resp.json();
                const select = document.getElementById('filterCategory');
                categories.forEach(c => {
                    select.innerHTML += `<option value="${c.slug}">${c.name}</option>`;
                });
            } catch(e) { console.error('Failed to load categories'); }
        }

        async function fetchScholarships(page = 1) {
            currentPage = page;
            const list = document.getElementById('scholarshipList');
            const countLabel = document.getElementById('scholarshipCount');

            const q = document.getElementById('searchInput').value;
            const category = document.getElementById('filterCategory').value;
            const coverage = document.getElementById('filterCoverage').value;

            let params = `?page=${page}`;
            if (q) params += `&q=${encodeURIComponent(q)}`;
            if (category) params += `&category=${category}`;
            if (coverage) params += `&coverage_type=${coverage}`;

            try {
                const resp = await apiFetch(`/scholarships/${params}`);
                const data = await resp.json();

                const results = data.results || data;
                const totalCount = data.count || results.length;

                list.innerHTML = '';
                countLabel.textContent = `${totalCount} beasiswa ditemukan`;

                if (results.length === 0) {
                    list.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-search fs-1 text-muted"></i>
                            <p class="text-muted mt-3">Tidak ada beasiswa yang cocok dengan filter.</p>
                        </div>`;
                    return;
                }

                results.forEach(s => {
                    const posterHtml = s.poster
                        ? `<img src="${s.poster}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="${s.title}">`
                        : `<div class="d-flex align-items-center justify-content-center" style="height: 200px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"><i class="bi bi-mortarboard-fill text-white" style="font-size: 3rem;"></i></div>`;

                    list.innerHTML += `
                        <div class="col-md-6 col-lg-4">
                            <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100 scholarship-card">
                                ${posterHtml}
                                <div class="card-body p-4">
                                    <div class="d-flex gap-2 mb-3 flex-wrap">
                                        <span class="badge rounded-pill ${getCoverageBadgeClass(s.coverage_type)}">${getCoverageLabel(s.coverage_type)}</span>
                                        ${s.category_name ? `<span class="badge rounded-pill bg-light text-dark border">${s.category_name}</span>` : ''}
                                    </div>
                                    <h5 class="fw-bold mb-2">${s.title}</h5>
                                    <p class="small text-muted mb-1"><i class="bi bi-building me-1"></i> ${s.provider_name}</p>
                                    <p class="small text-danger mb-3"><i class="bi bi-clock me-1"></i> Deadline: ${formatDate(s.deadline)}</p>
                                    <div class="d-flex gap-2">
                                        <a href="detail.html?slug=${s.slug}" class="btn btn-auth btn-sm flex-grow-1 rounded-pill">Detail</a>
                                        <button onclick="saveBookmark('${s.id}')" id="save-${s.id}" class="btn btn-outline-secondary btn-sm rounded-pill px-3" title="Bookmark">
                                            <i class="bi bi-bookmark"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                });

                // Pagination
                if (data.next || data.previous) {
                    renderPagination(data);
                }
            } catch (error) {
                console.error(error);
                list.innerHTML = `<div class="col-12 text-center text-danger py-5"><i class="bi bi-exclamation-triangle fs-1"></i><p class="mt-3">Gagal terhubung ke server!</p></div>`;
            }
        }

        function renderPagination(data) {
            const nav = document.getElementById('paginationNav');
            const list = document.getElementById('paginationList');
            nav.classList.remove('d-none');
            list.innerHTML = '';

            if (data.previous) {
                list.innerHTML += `<li class="page-item"><a class="page-link" href="#" onclick="fetchScholarships(${currentPage - 1}); return false;">&laquo; Prev</a></li>`;
            }
            list.innerHTML += `<li class="page-item active"><a class="page-link" href="#">${currentPage}</a></li>`;
            if (data.next) {
                list.innerHTML += `<li class="page-item"><a class="page-link" href="#" onclick="fetchScholarships(${currentPage + 1}); return false;">Next &raquo;</a></li>`;
            }
        }

        async function saveBookmark(scholarshipId) {
            try {
                const resp = await apiFetch('/me/bookmarks/', {
                    method: 'POST',
                    body: JSON.stringify({ scholarship: scholarshipId })
                });
                if (resp.ok) {
                    showToast('Berhasil disimpan!', 'success');
                    const btn = document.getElementById(`save-${scholarshipId}`);
                    btn.innerHTML = '<i class="bi bi-bookmark-fill"></i>';
                    btn.classList.remove('btn-outline-secondary');
                    btn.classList.add('btn-success');
                    btn.disabled = true;
                } else {
                    const err = await resp.json();
                    showToast(err.detail || 'Gagal menyimpan', 'warning');
                }
            } catch(e) {
                showToast('Error koneksi!', 'error');
            }
        }

        // Debounced search
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => fetchScholarships(), 400);
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
            fetchScholarships();
        });
    </script>
</body>
</html>
