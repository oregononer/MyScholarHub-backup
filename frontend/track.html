<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Submission | ScholarHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background-color: #f8f9fc; font-family: 'Poppins', sans-serif;">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-mortarboard-fill" style="color: #7b2cbf;"></i> ScholarHub</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Scholarships</a></li>
                    <li class="nav-item"><a class="nav-link" href="submit.html">Submit</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-submissions.html">My Submissions</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item ms-2"><button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-pill px-3"><i class="bi bi-box-arrow-right"></i> Logout</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5" style="max-width: 600px;">
        <div class="text-center mb-5">
            <div class="icon-box mx-auto mb-3" style="width: 60px; height: 60px; background: linear-gradient(135deg, #059669, #10b981);">
                <i class="bi bi-search text-white fs-4"></i>
            </div>
            <h2 class="fw-bold">Track Submission</h2>
            <p class="text-muted">Cek status pengajuan beasiswa menggunakan Tracking ID.</p>
        </div>

        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
            <form id="trackForm">
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-muted">Tracking ID (UUID)</label>
                    <input type="text" id="trackingInput" class="form-control form-control-custom text-center font-monospace" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" required>
                </div>
                <button type="submit" class="btn btn-auth w-100 rounded-pill" id="trackBtn">
                    <i class="bi bi-search me-1"></i> Cek Status
                </button>
            </form>

            <!-- Result -->
            <div id="trackResult" class="d-none mt-4">
                <hr>
                <div class="text-center">
                    <div id="statusBadge" class="mb-3"></div>
                    <p class="small text-muted">Diajukan pada: <span id="resultDate" class="fw-semibold"></span></p>
                    <div id="rejectionBox" class="d-none alert alert-danger small text-start mt-3">
                        <strong>Alasan Penolakan:</strong>
                        <p id="rejectionReason" class="mb-0 mt-1"></p>
                    </div>
                </div>
            </div>

            <div id="trackError" class="alert alert-danger small d-none mt-3"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script>
        if (!requireAuth()) { /* redirected */ }

        document.getElementById('trackForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const trackingId = document.getElementById('trackingInput').value.trim();
            const result = document.getElementById('trackResult');
            const errorDiv = document.getElementById('trackError');

            result.classList.add('d-none');
            errorDiv.classList.add('d-none');

            try {
                const resp = await apiFetch(`/promotions/${trackingId}/status/`);

                if (!resp.ok) {
                    errorDiv.textContent = 'Tracking ID tidak ditemukan.';
                    errorDiv.classList.remove('d-none');
                    return;
                }

                const data = await resp.json();
                result.classList.remove('d-none');

                // Status badge
                const statusColors = {
                    'PENDING': { bg: '#fef3c7', color: '#d97706', icon: 'hourglass-split', label: 'Pending Review' },
                    'PUBLISHED': { bg: '#d1fae5', color: '#059669', icon: 'check-circle-fill', label: 'Approved & Published' },
                    'REJECTED': { bg: '#fee2e2', color: '#dc2626', icon: 'x-circle-fill', label: 'Rejected' },
                    'DRAFT': { bg: '#f1f5f9', color: '#64748b', icon: 'pause-circle-fill', label: 'Draft / Taken Down' },
                };
                const st = statusColors[data.status] || statusColors['DRAFT'];
                document.getElementById('statusBadge').innerHTML = `
                    <div class="d-inline-flex align-items-center gap-2 px-4 py-3 rounded-pill" style="background: ${st.bg}; color: ${st.color};">
                        <i class="bi bi-${st.icon} fs-4"></i>
                        <span class="fw-bold">${st.label}</span>
                    </div>`;

                document.getElementById('resultDate').textContent = formatDate(data.created_at);

                // Rejection reason
                const rejBox = document.getElementById('rejectionBox');
                if (data.status === 'REJECTED' && data.rejection_reason) {
                    document.getElementById('rejectionReason').textContent = data.rejection_reason;
                    rejBox.classList.remove('d-none');
                } else {
                    rejBox.classList.add('d-none');
                }

            } catch(e) {
                errorDiv.textContent = 'Error koneksi ke server!';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
