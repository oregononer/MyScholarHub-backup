apiVersion: v1
kind: Namespace
metadata:
  name: scholarhub

---
# === REDIS DEPLOYMENT ===
# Digunakan untuk: Rate Limiting, Account Lockout Counter, JWT Token Blacklist, Password Reset Token
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: scholarhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server", "--appendonly", "yes", "--requirepass", "$(REDIS_PASSWORD)"]
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: scholarhub
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379

---
# === REDIS PERSISTENT VOLUME ===
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: scholarhub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# === MARIADB DEPLOYMENT ===
# Wajib InnoDB & utf8mb4 (sesuai spec)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: scholarhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        ports:
        - containerPort: 3306
        env:
        # Password dikelola Vault dynamic secret — root password hanya untuk bootstrap
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-secret
              key: root-password
        - name: MARIADB_DATABASE
          value: "scholarhub"
        args:
          - "--character-set-server=utf8mb4"
          - "--collation-server=utf8mb4_unicode_ci"
          - "--default-storage-engine=innodb"
          - "--innodb-file-per-table=1"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: mariadb-data
          mountPath: /var/lib/mysql
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost"]
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: mariadb-data
        persistentVolumeClaim:
          claimName: mariadb-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: scholarhub
spec:
  selector:
    app: mariadb
  ports:
  - port: 3306
    targetPort: 3306

---
# === MARIADB PERSISTENT VOLUME ===
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: scholarhub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# === KUBERNETES SECRETS (Ganti nilainya sebelum deploy!) ===
# IMPORTANT: Ini hanya placeholder. Saat production, gunakan Vault atau sealed-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
  namespace: scholarhub
type: Opaque
stringData:
  root-password: "GANTI_DENGAN_PASSWORD_AMAN"

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: scholarhub
type: Opaque
stringData:
  password: "GANTI_DENGAN_PASSWORD_AMAN"